name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - name: Set up Python
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.10"
      - name: Install test requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      - name: Run pytest
        run: |
          set -o pipefail
          pytest -rfE --tb=short 2>&1 | tee pytest.log
      - name: Report failures as annotations
        if: failure()
        run: |
          python - <<'PY'
          import re
          log = open("pytest.log", encoding="utf-8", errors="replace").read()
          summary = [l for l in log.splitlines() if re.match(r"^(FAILED|ERROR) ", l)]
          details = [l for l in log.splitlines() if l.startswith("E ") or "Error" in l][:120]
          def emit(title, lines, size=12):
              chunks = [lines[i:i + size] for i in range(0, len(lines), size)][:4]
              for n, chunk in enumerate(chunks, 1):
                  body = "%0A".join(x.replace("%", "%25")[:300] for x in chunk)
                  print(f"::error title={title} {n}::{body}")
          emit("pytest failures", summary)
          emit("pytest details", details)
          PY
